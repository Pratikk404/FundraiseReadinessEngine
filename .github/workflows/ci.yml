name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build
        working-directory: fundraise-backend
        run: ./mvnw compile -B -q

      - name: Run tests
        working-directory: fundraise-backend
        run: ./mvnw test -B

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fundraise-frontend/package-lock.json

      - name: Install dependencies
        working-directory: fundraise-frontend
        run: npm ci

      - name: Lint
        working-directory: fundraise-frontend
        run: npm run lint || true

      - name: Build
        working-directory: fundraise-frontend
        run: npm run build

  worker:
    name: Worker Install Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fundraise-worker/package-lock.json

      - name: Install dependencies
        working-directory: fundraise-worker
        run: npm ci
