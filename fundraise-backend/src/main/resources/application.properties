# ===========================================
# Fundraise Readiness Engine - Configuration
# ===========================================

# Server
server.port=8080

# ===========================================
# DATABASE CONFIGURATION
# ===========================================
# Using H2 for local development
# Switch to PostgreSQL by activating 'prod' profile

spring.datasource.url=jdbc:h2:mem:fundraise_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================================
# JWT CONFIGURATION
# ===========================================
app.jwt.secret=fundraise-readiness-engine-secret-key-change-in-production-2026
app.jwt.expiration-ms=86400000
app.jwt.token-prefix=Bearer

# ===========================================
# FILE UPLOAD
# ===========================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=./uploads

# ===========================================
# CORS
# ===========================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
