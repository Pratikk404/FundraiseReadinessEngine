# ===========================================
# Fundraise Readiness Engine - Configuration
# ===========================================

# Server
server.port=8080

# ===========================================
# DATABASE CONFIGURATION
# ===========================================
# Using H2 for local development
# Switch to PostgreSQL by activating 'prod' profile

spring.datasource.url=jdbc:h2:mem:fundraise_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================================
# JWT CONFIGURATION
# ===========================================
app.jwt.secret=fundraise-readiness-engine-secret-key-change-in-production-2026
app.jwt.expiration-ms=86400000
app.jwt.token-prefix=Bearer

# ===========================================
# FILE UPLOAD
# ===========================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=./uploads

# ===========================================
# LLM CONFIGURATION (for gap report generation)
# ===========================================
# Set your API key to enable LLM-powered narratives
# Leave empty to use deterministic fallback
app.llm.api-key=
app.llm.api-url=https://api.openai.com/v1/chat/completions
app.llm.model=gpt-4o-mini

# ===========================================
# CORS
# ===========================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ===========================================
# EMAIL (set SMTP env vars in production)
# ===========================================
app.email.enabled=false
app.email.from=noreply@fundraise-readiness.com
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===========================================
# FRONTEND URL (for email links)
# ===========================================
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ===========================================
# STRIPE (set env vars in production)
# ===========================================
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.pro-price-id=${STRIPE_PRO_PRICE_ID:}
app.stripe.advisor-price-id=${STRIPE_ADVISOR_PRICE_ID:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
