# ===========================================
# Production Profile — PostgreSQL
# Activate with: --spring.profiles.active=prod
# Requires Docker Compose running: docker-compose up -d
# ===========================================

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/fundraise_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=fundraise
spring.datasource.password=fundraise123

# JPA — use validate in production, never create-drop
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# H2 Console disabled in production
spring.h2.console.enabled=false

# JWT — override secret in production via env var
# app.jwt.secret=${JWT_SECRET:change-me-in-production}
