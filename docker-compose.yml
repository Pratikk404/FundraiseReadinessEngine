version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fundraise-postgres
    environment:
      POSTGRES_DB: fundraise_db
      POSTGRES_USER: fundraise
      POSTGRES_PASSWORD: fundraise123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundraise -d fundraise_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: fundraise-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: fundraise
      MONGO_INITDB_ROOT_PASSWORD: fundraise123
      MONGO_INITDB_DATABASE: fundraise_docs
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fundraise-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mongo_data:
  redis_data:
