version: '3.8'

services:
  # ============================================
  # DATABASES
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: fundraise-postgres
    environment:
      POSTGRES_DB: fundraise_db
      POSTGRES_USER: fundraise
      POSTGRES_PASSWORD: fundraise123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundraise -d fundraise_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: fundraise-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: fundraise
      MONGO_INITDB_ROOT_PASSWORD: fundraise123
      MONGO_INITDB_DATABASE: fundraise_docs
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fundraise-redis
    ports:
      - "6339:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # BACKEND (Spring Boot)
  # ============================================
  backend:
    build:
      context: ./fundraise-backend
      dockerfile: Dockerfile
    container_name: fundraise-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fundraise_db
      SPRING_DATASOURCE_USERNAME: fundraise
      SPRING_DATASOURCE_PASSWORD: fundraise123
      APP_JWT_SECRET: fundraise-readiness-engine-secret-key-change-in-production-2026
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ============================================
  # FRONTEND (React)
  # ============================================
  frontend:
    build:
      context: ./fundraise-frontend
      dockerfile: Dockerfile
    container_name: fundraise-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ============================================
  # WORKER (Node.js document processor)
  # ============================================
  worker:
    build:
      context: ./fundraise-worker
      dockerfile: Dockerfile
    container_name: fundraise-worker
    environment:
      REDIS_URL: redis://redis:6379
      MONGO_URL: mongodb://fundraise:fundraise123@mongodb:27017/fundraise_docs?authSource=admin
      BACKEND_URL: http://backend:8080
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  redis_data:
